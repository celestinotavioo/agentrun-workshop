name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: make manifests && git diff --exit-code -- api config
        name: generated code is up to date
      - run: make lint
      - run: make test

  # The exact environment participants get in Codespaces: build it, then run the workshop inside it.
  codespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            bash hack/cluster-up.sh
            make check
            make stage-check
